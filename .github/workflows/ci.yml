name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      # supportops-copilot has its own dependencies (httpx, anthropic, PyJWT)
      # and its own workflow. Collecting it here fails at import time, because
      # the root requirements.txt does not install them.
      - run: pytest -q --ignore=supportops-copilot
        env:
          PYTHONPATH: ${{ github.workspace }}
