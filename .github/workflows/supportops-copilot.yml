name: supportops-copilot

on:
  push:
    paths:
      - "supportops-copilot/**"
      - ".github/workflows/supportops-copilot.yml"
  pull_request:
    paths:
      - "supportops-copilot/**"
      - ".github/workflows/supportops-copilot.yml"

defaults:
  run:
    working-directory: supportops-copilot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: supportops-copilot/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check the Zendesk App JavaScript
        # The sidebar JS has no test suite (see README "Known limitations").
        # A syntax check is the floor, not a substitute for one.
        run: node --check zendesk_app/assets/main.js
      - name: Validate the Zendesk App and automation config
        run: |
          python -c "import json,glob,sys; [json.load(open(f,encoding='utf-8')) for f in glob.glob('zendesk_app/**/*.json',recursive=True)+glob.glob('zendesk/**/*.json',recursive=True)]; print('config JSON valid')"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: supportops-copilot
          file: supportops-copilot/docker/Dockerfile
          push: false
          load: true
          tags: supportops-copilot:ci
      - name: Smoke-test the image
        run: |
          docker run -d --name copilot -p 8000:8000 \
            -e ZENDESK_SUBDOMAIN=ci-sandbox \
            -e TOKEN_ENCRYPTION_KEY="$(openssl rand -base64 32 | tr '+/' '-_')" \
            supportops-copilot:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/healthz; then echo "healthy"; exit 0; fi
            sleep 1
          done
          echo "container never became healthy"; docker logs copilot; exit 1
