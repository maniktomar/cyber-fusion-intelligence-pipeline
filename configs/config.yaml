app:
  name: real-time-cyber-fusion-intelligence
  environment: local

kafka:
  bootstrap_servers: ${KAFKA_BOOTSTRAP_SERVERS}
  security_events_topic: ${KAFKA_SECURITY_EVENTS_TOPIC}
  log_topic: ${KAFKA_LOG_TOPIC}
  producer_events_per_second: ${PRODUCER_EVENTS_PER_SECOND}
  consumer_group: security-streaming-pipeline

spark:
  app_name: ${SPARK_APP_NAME}
  checkpoint_base: ${SPARK_CHECKPOINT_BASE}
  trigger_processing_time: "15 seconds"
  watermark_delay: "10 minutes"

snowflake:
  account: ${SNOWFLAKE_ACCOUNT}
  user: ${SNOWFLAKE_USER}
  password: ${SNOWFLAKE_PASSWORD}
  role: ${SNOWFLAKE_ROLE}
  warehouse: ${SNOWFLAKE_WAREHOUSE}
  database: ${SNOWFLAKE_DATABASE}
  schema: ${SNOWFLAKE_SCHEMA}
  url: ${SNOWFLAKE_URL}

quality_rules:
  max_bytes_out: 10000000000
  accepted_event_types: ["authentication", "data_access", "api_call", "privilege_change", "config_change"]
  accepted_outcomes: ["success", "failure", "blocked"]
  late_event_minutes: 10

detection_rules:
  failed_attempts_threshold: 10
  data_egress_bytes_threshold: 500000000
  api_request_rate_threshold: 300
  high_risk_countries: ["RU", "KP", "IR", "BY", "NG"]
  off_hours_start: 22
  off_hours_end: 6
